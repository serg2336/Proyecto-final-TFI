name: Laravel CI

on: push: branches: - main - develop - ci/github-actions

pull_request: branches: - main - develop

jobs: laravel-tests: runs-on: ubuntu-latest

steps:
  - name: Checkout del código
    uses: actions/checkout@v4

  - name: Configurar PHP 8.4
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.4'
      extensions: mbstring, bcmath, pdo, sqlite3, pdo_sqlite, gd, zip
      coverage: none

  - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      cache: npm

  - name: Instalar dependencias de Node
    run: npm ci

  - name: Compilar assets de Vite
    run: npm run build

  - name: Instalar dependencias de Composer
    run: composer install --prefer-dist --no-progress --no-interaction

  - name: Copiar archivo .env
    run: cp .env.example .env

  - name: Generar clave de aplicación
    run: php artisan key:generate

  - name: Verificar conexión de pruebas
    run: |
      php -r "echo 'DB_CONNECTION=' . getenv('DB_CONNECTION') . PHP_EOL;"
      php -r "echo 'DB_DATABASE=' . getenv('DB_DATABASE') . PHP_EOL;"
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''

  - name: Ejecutar pruebas
    run: php artisan test
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''