
name: Laravel CI

on:
  push:
    branches:
      - main
      - develop
      - ci/github-actions

  pull_request:
    branches:
      - main
      - develop

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Compilar assets de Vite
        run: npm run build

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copiar archivo .env
        run: cp .env.example .env

      - name: Generar clave de aplicacion
        run: php artisan key:generate

      - name: Limpiar configuracion
        run: php artisan config:clear

      - name: Verificar conexion de Laravel
        run: |
          php artisan tinker --execute="dump(config('database.default')); dump(config('database.connections.sqlite.database'));"

      - name: Ejecutar pruebas
        run: php artisan test
