name: Laravel CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: protipo-italFiat
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, bcmath, pdo, mysql, gd, zip
        coverage: none

    # --- ESTO ES LO NUEVO: Instalar Node.js y compilar Vite ---
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias de Node
      run: npm install

    - name: Compilar assets (Vite)
      run: npm run build
    # ----------------------------------------------------------

    - name: Instalar dependencias de Composer
      run: composer install --prefer-dist --no-progress

    - name: Copiar archivo .env
      run: cp .env.example .env

    - name: Generar clave de aplicación
      run: php artisan key:generate

    - name: Ejecutar migraciones
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: protipo-italFiat
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan migrate --force

    - name: Ejecutar pruebas (PHPUnit)
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: protipo-italFiat
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan test